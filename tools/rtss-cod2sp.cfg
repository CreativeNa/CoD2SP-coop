; RTSS per-application profile for Call of Duty 2 (single player).
; Copy to:  C:\Program Files (x86)\RivaTuner Statistics Server\Profiles\CoD2SP_s.exe.cfg
;
; Why: RTSSHooks.dll crashes CoD2SP_s.exe with EXCEPTION_STACK_OVERFLOW (0xC00000FD) at
; RTSSHooks.dll+0xAE377. Reproduced on 2026-11-25 with our proxy and mod removed, so the
; overlay alone is the cause, not the co-op code. Pressing RTSS's own hotkeys (PgUp /
; Delete) hits the same hook.
;
; EnableHooking=0 is the file equivalent of the GUI setting
;   Add -> CoD2SP_s.exe -> Application detection level = None
; Missing keys fall back to the global profile, so this sparse file is enough.

[Hooking]
EnableHooking=0

[OSD]
EnableOSD=0
